  yazi("Rümeysa Betül Özyurt · Veri İletişimi (BİL321)",W/2,810,32,R.acik,o*c,600);

// ---------------- altyazı -----------------------------------------------------------------
function altyazi(t){const s=V.sahneler.find(s=>t>=s.konusma_bas&&t<s.konusma_son);if(!s||!s.cumleler)return;
  const lt=t-s.konusma_bas,top=s.cumleler.reduce((a,c)=>a+c.length,0),sure=s.konusma_son-s.konusma_bas;let acc=0;
  for(const c of s.cumleler){const d=sure*c.length/top;if(lt<acc+d){X.save();X.font=`600 34px ${F}`;const w=Math.min(1700,X.measureText(c).width+70);X.restore();
      const o=Math.min(1,(lt-acc)/.2,(acc+d-lt)/.2);kutu(W/2-w/2,970,w,66,18,"rgba(8,14,30,.78)",o);yazi(c,W/2,1004,34,R.beyaz,o,600);return;}acc+=d;}}

// ---------------- ana render --------------------------------------------------------------
function render(t){arkaPlan(t);const S=V.sahneler;
  for(let i=0;i<S.length;i++){const s=S[i],d=s.son-s.bas;if(t<s.bas-.6||t>s.son+.6)continue;
    const lt=t-s.bas,o=Math.min(eo(ilerle(t,s.bas-.1,s.bas+.5)),1-eo(ilerle(t,s.son-.45,s.son+.05)));
    // giriş: hafif yakınlaşma (kamera)
    const z=1+.04*(1-eo(ilerle(lt,0,1.2)));X.save();X.translate(W/2,H/2);X.scale(z,z);X.translate(-W/2,-H/2);
    if(o>0)SAHNE[i](lt,d,o);X.restore();}
  // sahne geçişi: ışık süpürmesi
  for(const s of S.slice(1)){const p=ilerle(t,s.bas-.35,s.bas+.35);if(p>0&&p<1){const x=lerp(-400,W+400,eio(p));
    const g=X.createLinearGradient(x-300,0,x+300,0);g.addColorStop(0,"rgba(166,240,212,0)");g.addColorStop(.5,"rgba(166,240,212,.18)");g.addColorStop(1,"rgba(166,240,212,0)");
    X.fillStyle=g;X.fillRect(0,0,W,H);}}
  altyazi(t);
  // ilerleme çubuğu
  const top=S[S.length-1].son;kutu(0,H-6,W*kis(t/top,0,1),6,0,R.yesil,.8);}
window.render=render;window.SURE=V.sahneler[V.sahneler.length-1].son;
if(!window.KAYIT){const t0=performance.now();(function d(){render(((performance.now()-t0)/1000)%window.SURE);requestAnimationFrame(d);})();}
